name: Run Automation Tests

on:

  repository_dispatch:
    types:
      - run-automation-tests

  workflow_dispatch:
    inputs:
      app_url:
        description: 'Application URL to test'
        required: true
        default: 'https://your-org.github.io/taskflow-app/'
      browser:
        description: 'Browser'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      env:
        description: 'Target environment'
        required: false
        default: 'staging'
      build_number:
        description: 'Build number (optional)'
        required: false
        default: 'manual'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: automation-${{ github.event.client_payload.build_number || github.run_number }}
  cancel-in-progress: false

jobs:

  run-tests:
    name: 🧪 Selenium Test Execution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. CHECKOUT ──────────────────────────────────────────────────────
      - name: Checkout automation repository
        uses: actions/checkout@v4

      # ── 2. RESOLVE PARAMETERS ────────────────────────────────────────────
      - name: Resolve test parameters from dispatch payload or inputs
        id: params
        run: |
          resolve() {
            echo "${1:-${2:-${3}}}"
          }

          APP_URL=$(resolve "${{ github.event.client_payload.app_url }}" "${{ github.event.inputs.app_url }}" "http://localhost:8080")
          BROWSER=$(resolve "${{ github.event.client_payload.browser }}" "${{ github.event.inputs.browser }}" "chrome")
          ENV=$(resolve "${{ github.event.client_payload.env }}" "${{ github.event.inputs.env }}" "staging")
          BUILD_NUMBER=$(resolve "${{ github.event.client_payload.build_number }}" "${{ github.event.inputs.build_number }}" "${{ github.run_number }}")
          TRIGGERED_BY=$(resolve "${{ github.event.client_payload.triggered_by }}" "${{ github.actor }}" "unknown")
          BRANCH=$(resolve "${{ github.event.client_payload.branch }}" "${{ github.ref_name }}" "unknown")
          COMMIT_SHA=$(resolve "${{ github.event.client_payload.commit_sha }}" "${{ github.sha }}" "unknown")

          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "browser=${BROWSER}" >> "$GITHUB_OUTPUT"
          echo "env=${ENV}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "triggered_by=${TRIGGERED_BY}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      # ── 3. JAVA SETUP ────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # ── 🔥 3.1 CRITICAL FIXES (NEW) ──────────────────────────────────────
      - name: Remove system chromedriver (pre-installed wrong version)
        run: sudo rm -f /usr/bin/chromedriver || true

      - name: Clear Selenium/WebDriverManager cache
        run: rm -rf ~/.cache/selenium

      # ── 4. BROWSER SETUP ─────────────────────────────────────────────────
      - name: Install/verify browser
        run: |
          BROWSER="${{ steps.params.outputs.browser }}"
          echo "Target browser: ${BROWSER}"

          case "${BROWSER}" in
            chrome)
              google-chrome --version
              echo "✅ Chrome available"
              ;;
            firefox)
              sudo apt-get install -y firefox
              firefox --version
              echo "✅ Firefox installed"
              ;;
            edge)
              sudo apt-get install -y microsoft-edge-stable || true
              echo "✅ Edge setup attempted"
              ;;
          esac

      # ── 5. RUN TESTS ─────────────────────────────────────────────────────
      - name: Run Selenium tests via Maven
        id: test-run
        continue-on-error: true
        run: |
          mvn test \
            -Dapp.url="${{ steps.params.outputs.app_url }}" \
            -Dbrowser="${{ steps.params.outputs.browser }}" \
            -Denv="${{ steps.params.outputs.env }}" \
            -Dbuild.number="${{ steps.params.outputs.build_number }}" \
            -Dtriggered.by="${{ steps.params.outputs.triggered_by }}" \
            -Dheadless=true \
            --no-transfer-progress \
            -B

      # ── 6. GENERATE ALLURE REPORT ─────────────────────────────────────────
      - name: Copy Allure categories config into results directory
        if: always()
        run: |
          chmod +x copy-allure-config.sh
          ./copy-allure-config.sh

      - name: Generate Allure HTML report
        if: always()
        run: |
          if ! command -v allure &> /dev/null; then
            echo "Installing Allure CLI..."
            curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
            tar -xzf allure.tgz
            sudo mv allure-2.27.0 /opt/allure
            sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          fi

          allure generate target/allure-results \
            --output target/allure-report \
            --clean \
            || echo "⚠️ Allure generation failed"

      # ── 6.1 PUBLISH ALLURE ───────────────────────────────────────────────
      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: allure-report/${{ steps.params.outputs.build_number }}

      # ── 7. UPLOAD ARTIFACTS ──────────────────────────────────────────────
      - name: Upload Allure results (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-build-${{ steps.params.outputs.build_number }}
          path: target/allure-results/
          retention-days: 30

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-build-${{ steps.params.outputs.build_number }}
          path: target/allure-report/
          retention-days: 30

      - name: Upload Surefire XML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-build-${{ steps.params.outputs.build_number }}
          path: target/surefire-reports/
          retention-days: 30

      # ── 8. SUMMARY ───────────────────────────────────────────────────────
      - name: Parse test results and write job summary
        if: always()
        run: |
          echo "## 🧪 Automation Test Results" >> $GITHUB_STEP_SUMMARY

      # ── 9. FINAL STATUS ──────────────────────────────────────────────────
      - name: Fail job if tests failed
        if: steps.test-run.outcome == 'failure'
        run: |
          echo "❌ Tests failed — marking job as failed."
          exit 1
